name: Reproduce spent continuation
on: push
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, pdo_sqlite, curl, intl
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - name: Capture portable test runtime
        run: |
          mkdir -p /tmp/php-test-runtime
          cp /usr/bin/php8.5 /tmp/php-test-runtime/php
          cp -r "$(php -r 'echo ini_get("extension_dir");')" /tmp/php-test-runtime/extensions
          cp /usr/bin/composer /tmp/php-test-runtime/composer
          tar -czf /tmp/php-test-runtime.tar.gz -C /tmp php-test-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: php-test-runtime
          path: /tmp/php-test-runtime.tar.gz
          retention-days: 1
      - run: php artisan test --filter SpentContinuationTest
