name: Core

on:
  pull_request:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    uses: ./.github/workflows/php-tests.yml
    with:
      suite: core
