name: Tests

on:
  push:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PHP 8.5 / PostgreSQL 18 / Node 24
            profile: false
          - name: PostgreSQL participation profile
            profile: true
    runs-on: ubuntu-latest
    # Includes the exhaustive unbatched PostgreSQL reference calculation.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -q -d testing -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, curl, intl
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Set up Node
        if: ${{ !matrix.profile }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        if: ${{ !matrix.profile }}
        run: npm ci

      - name: Build frontend
        if: ${{ !matrix.profile }}
        run: npm run build

      - name: Test frontend action contracts
        if: ${{ !matrix.profile }}
        run: npm run test:ui

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Check recovery semantics, optimistic reads and PostgreSQL contention
        if: ${{ !matrix.profile }}
        env:
          PGOPTIONS: '-c statement_timeout=30s'
        run: php artisan test --filter 'PotentialProjectionTest|PotentialRegionCalculatorTest|PropositionReadTest|BranchTragedyTest|TransactionLockOrderTest|ParticipantContextTest|CausalRecoveryTest|RecoveryBasinResolverTest|LocalParticipantNavigationTest|ParticipantContinuityTest' --stop-on-failure

      - name: Run test suite
        if: ${{ !matrix.profile && !cancelled() }}
        env:
          PGOPTIONS: '-c statement_timeout=30s'
          COMMONS_PROFILE_SQL: '1'
        run: php artisan test --display-warnings

      - name: Profile scoped PostgreSQL reads
        if: ${{ matrix.profile }}
        env:
          PGOPTIONS: '-c statement_timeout=30s'
          COMMONS_PROFILE_SQL: '1'
        run: php artisan test --filter 'ParticipationPerformanceTest|ReceiptContextMigrationTest' --display-warnings
