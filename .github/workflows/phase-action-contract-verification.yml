name: Phase action contract verification

on:
  push:
    branches:
      - refactor/phase-action-contracts
    paths:
      - app/**
      - config/**
      - database/migrations/**
      - tests/**
      - .github/workflows/phase-action-contract-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, sqlite3
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan config:cache
          php artisan config:clear

      - name: Verify fresh schema
        run: php artisan migrate:fresh --force

      - name: Run tests
        run: composer test

      - name: Check changed-file formatting
        run: vendor/bin/pint --test app/Models/Cycle.php app/Models/Participant.php app/Services/InputSchemaService.php app/Services/PhaseService.php config/phases.php config/schemas.php database/migrations/2026_02_04_085426_create_initial_tables.php tests/Feature/InputSchemaServiceTest.php
