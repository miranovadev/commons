name: Part 2 measured PostgreSQL diagnosis

on:
  push:
    branches: [nova/ci-runtime-diagnosis]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: current-tragedy-isolated
            filter: 'ParticipationTragedyLifecycleTest::'
            fresh: '0'
            profile: '0'
          - case: aggregate-fresh-schemas
            filter: '(ClosureValuesTest|ExampleTest|PotentialRegionCalculatorTest|ProjectionServiceTest|RecoveryBasinResolverTest|CommonsUiApiTest|ParticipantCollectionApiTest|ParticipantConnectionApiTest|ParticipationApiTest|ParticipationHttpHarnessTest|ParticipationLifecycleRegressionTest|ParticipationLocalEpochTest|ParticipationRecoveryTest|ParticipationSourceEquivalenceTest|ParticipationStaggeredEpochTest|ParticipationTragedyLifecycleTest)::'
            fresh: '1'
            profile: '0'
          - case: query-profile-off
            filter: 'ParticipationPerformanceTest::'
            fresh: '0'
            profile: '0'
          - case: query-profile-on
            filter: 'ParticipationPerformanceTest::'
            fresh: '0'
            profile: '1'

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -q -d testing -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      COMPOSER_PROCESS_TIMEOUT: 0
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, curl, intl
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Run selected PHP suite
        env:
          TEST_SUITE: ${{ 'core' }}
          PGOPTIONS: '-c statement_timeout=30s'
          COMMONS_PROFILE_SQL: ${{ matrix.profile }}
          COMMONS_DIAGNOSE_FRESH: ${{ matrix.fresh }}
          COMMONS_DIAGNOSE_TRAGEDY_SQL: '1'
        run: |
          case "$TEST_SUITE" in
            core|integration-full|query|load) ;;
            *) echo "Unknown test suite: $TEST_SUITE" >&2; exit 1 ;;
          esac
          php artisan config:clear
          mkdir -p test-results
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 510s php artisan test --filter='${{ matrix.filter }}' --log-junit=test-results/diagnostic.xml 2>&1 | tee test-results/diagnostic.log

      - name: Upload PHP test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-${{ matrix.case }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
