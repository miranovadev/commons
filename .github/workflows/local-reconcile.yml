name: Local Reconcile cursor diagnostic

on:
  push:
    branches: ['diagnostic/chirality-v3-local-reconcile']
    paths:
      - 'diagnostics/chirality-v3-local-reconcile/**'
      - '.github/workflows/local-reconcile.yml'

permissions:
  contents: read

jobs:
  rhythm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - population: 3
            case: sparse_5
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -q -d testing -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      BROADCAST_CONNECTION: 'null'
      RHYTHM_POPULATION: ${{ matrix.population }}
      RHYTHM_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, pdo_sqlite, curl, intl
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - name: Restore exact preserved history
        run: tar -xzf diagnostics/chirality-v3-positive-window/runtime-results.tar.gz -C diagnostics/chirality-v3-positive-window
      - name: Replay exact authored sequence with isolated candidate
        run: vendor/bin/phpunit --bootstrap diagnostics/chirality-v3-local-reconcile/bootstrap.php diagnostics/chirality-v3-local-reconcile/ReconcileReplayTest.php
      - name: Restore existing one-participant control
        run: tar -xzf diagnostics/chirality-v3-natural-rhythm/runtime-results.tar.gz -C diagnostics/chirality-v3-natural-rhythm
      - name: Single-participant unchanged 17-action prefix under both models
        run: vendor/bin/phpunit --bootstrap diagnostics/chirality-v3-local-reconcile/bootstrap.php diagnostics/chirality-v3-local-reconcile/SingleReconcileTest.php
      - name: Canonical fresh classification grounding
        run: vendor/bin/phpunit --filter test_reclassification_preserves_evidence_and_content_without_copying_judgments_or_uptake tests/Feature/ReclassificationEvidenceTest.php
      - name: Canonical reconciliation creates fresh source
        run: vendor/bin/phpunit --filter test_reconcile_is_structural_selection_with_exact_gate_content tests/Feature/ReconciliationTest.php
      - name: Canonical stale Bias source recheck
        run: vendor/bin/phpunit --filter test_stale_local_or_homologous_source_is_rejected_without_any_write tests/Feature/HomologousBiasTest.php
      - name: Print lossless evidence
        if: always()
        run: python3 diagnostics/chirality-v3-local-reconcile/export.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-reconcile-${{ matrix.population }}-${{ matrix.case }}
          path: diagnostics/chirality-v3-local-reconcile/*.json
          retention-days: 30
