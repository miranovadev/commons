name: Load / Concurrency

on:
  push:
    branches:
      - 'load/**'
      - 'validate/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    uses: ./.github/workflows/php-tests.yml
    with:
      suite: load
