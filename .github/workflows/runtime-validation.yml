name: Part 2 deliberate manual-suite validation

on:
  push:
    branches: [nova/ci-runtime-architecture]

permissions:
  contents: read

jobs:
  query:
    uses: ./.github/workflows/php-tests.yml
    with:
      suite: query
  load:
    uses: ./.github/workflows/php-tests.yml
    with:
      suite: load
