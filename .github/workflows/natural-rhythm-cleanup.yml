name: Stop superseded rhythm runs
on:
  push:
    branches: ['diagnostic/chirality-v3-natural-rhythm']
    paths: ['.github/workflows/natural-rhythm-cleanup.yml']
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel only the superseded diagnostic runs from this task
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for run in 37106367745 37106467809 37106917477; do
            gh run cancel "$run" || true
          done
