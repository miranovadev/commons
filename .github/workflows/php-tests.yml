name: PHP suite runner

on:
  workflow_call:
    inputs:
      suite:
        description: Composer test suite (core, integration, query, load)
        required: true
        type: string
      shard:
        type: number
        default: 1
      shards:
        type: number
        default: 1
      profile_sql:
        description: Optional EXPLAIN diagnostics for Query Regression
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: PHP / PostgreSQL (${{ inputs.shard }}/${{ inputs.shards }})
    runs-on: ubuntu-latest
    # Core follows a frontend job capped at two minutes: 2 + 8 = 10.
    timeout-minutes: ${{ inputs.suite == 'core' && 12 || inputs.suite == 'load' && 30 || 20 }}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -q -d testing -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      COMPOSER_PROCESS_TIMEOUT: 0
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, pdo_sqlite, curl, intl
          coverage: none
          tools: composer:v2

      - name: Install bounded native PDF reader
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils util-linux

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Download the Core frontend build
        if: ${{ inputs.suite == 'core' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Discover shard runtime dependencies
        id: selection
        env:
          TEST_SUITE: ${{ inputs.suite }}
          CI_SHARD: ${{ inputs.shard }}
          CI_SHARDS: ${{ inputs.shards }}
        run: python3 scripts/ci/run-suite.py "$TEST_SUITE" --shard "$CI_SHARD" --shards "$CI_SHARDS" --plan

      - name: Set up the websocket smoke client runtime
        if: ${{ steps.selection.outputs.needs_node == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the locked websocket smoke client
        if: ${{ steps.selection.outputs.needs_node == 'true' }}
        run: npm ci

      - name: Verify Cycle entry and Closure migrations on SQLite
        if: ${{ inputs.suite == 'core' && inputs.shard == 1 }}
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --filter='CommittalClosureTest|CycleEntryIdentityTest'

      - name: Run selected PHP suite
        # SQLite preflight failures must not hide the PostgreSQL suite inventory.
        if: ${{ !cancelled() && steps.selection.outcome == 'success' }}
        env:
          TEST_SUITE: ${{ inputs.suite }}
          COMMONS_INTEGRATION_MAINTENANCE: ${{ inputs.suite == 'integration' && '1' || '0' }}
          PGOPTIONS: '-c statement_timeout=30s'
          COMMONS_PROFILE_SQL: ${{ inputs.suite == 'query' && inputs.profile_sql && '1' || '0' }}
          CI_SHARD: ${{ inputs.shard }}
          CI_SHARDS: ${{ inputs.shards }}
        run: |
          case "$TEST_SUITE" in
            core|integration|query|load) ;;
            *) echo "Unknown test suite: $TEST_SUITE" >&2; exit 1 ;;
          esac
          php artisan config:clear
          audit=()
          if [[ "$TEST_SUITE" == core && "$CI_SHARD" == 1 ]]; then
            audit=(--audit)
          fi
          python3 scripts/ci/run-suite.py "$TEST_SUITE" --shard "$CI_SHARD" --shards "$CI_SHARDS" "${audit[@]}"

      - name: Upload PHP test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ inputs.suite }}-${{ inputs.shard }}-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
