name: Query Regression

on:
  push:
    branches:
      - 'query/**'
      - 'validate/**'
  workflow_dispatch:
    inputs:
      profile_sql:
        description: Include optional EXPLAIN diagnostics
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  query:
    uses: ./.github/workflows/php-tests.yml
    with:
      suite: query
      profile_sql: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_sql || false }}
