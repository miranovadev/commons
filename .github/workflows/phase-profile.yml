name: Phase Profile final validation
on:
  push:
    branches: [validation/phase-profile-stage2]
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        filter: ['FreshBootstrapTest', 'ParticipationHttpHarnessTest::test_real_http_actions_reach_an_operational_commit', 'HorizonProofCycleTest']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -q -d testing -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_DATABASE: testing
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      COMPOSER_PROCESS_TIMEOUT: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fae6763df7fb927fd7eee4565e5c114bc7ab83ac
      - uses: actions/checkout@v4
        with:
          path: .validation
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, pdo_sqlite, curl, intl
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - run: python3 .validation/scripts/ci/install-validation-trace.py
      - run: php artisan test --filter='${{ matrix.filter }}' --log-junit=test-results/continuation.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuation-${{ strategy.job-index }}
          path: test-results/
