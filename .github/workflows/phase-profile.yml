name: Phase Profile contracts

on:
  push:
    paths:
      - 'app/**'
      - 'resources/**'
      - 'app/Services/Observables/PhaseProfile*.php'
      - 'app/Services/LedgerService.php'
      - 'app/Services/ContributionDispatcher.php'
      - 'app/Console/Commands/InspectPhaseProfile.php'
      - 'database/migrations/*phase_profile*'
      - 'database/migrations/*prospective_closure*'
      - 'tests/**'
      - 'scripts/ci/**'
      - '.github/workflows/integration-full.yml'
      - '.github/workflows/php-tests.yml'
      - '.github/workflows/phase-profile.yml'

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
        validation: [contracts, fixtures]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -q -d testing -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'testing' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, curl, intl
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - name: Phase Profile contracts
        if: matrix.validation == 'contracts'
        run: php artisan test tests/Unit/PhaseProfileComparisonTest.php tests/Feature/PhaseProfileTest.php --display-warnings
      - name: Prospective Closure contracts
        if: always() && matrix.validation == 'contracts'
        run: php artisan test --filter='ProspectiveClosure' --display-warnings --fail-on-empty-test-suite
      - name: Existing observable and ledger contracts
        if: always() && matrix.validation == 'contracts'
        run: php artisan test --filter='Cardinal|Correspondence|CycleEntryIdentity|PhasePositionInvariant|ContextHorizonProjector|ClosureBirth|PropositionLocalChirality|CanonicalCommit|ChiralityV2|AttestationBeat|HomeostaticPopulation|PropositionHistorySemantics|coherent_positive_inputs_produce_the_normal_result' --display-warnings
      - name: Representative fixture repairs
        if: always() && matrix.validation == 'fixtures'
        run: php artisan test tests/Feature/PersistInstrumentTest.php tests/Feature/ReinforcementTest.php tests/Feature/WriteOnceTest.php tests/Feature/ExhaustionTest.php tests/Feature/ClosureHysteresisTest.php tests/Feature/ParticipantWakeTest.php tests/Feature/ParticipantContinuityTest.php tests/Feature/AttestationDirectionChangeTest.php tests/Feature/LocalParticipantNavigationTest.php --display-warnings
      - name: Formatting and whitespace
        if: always() && matrix.validation == 'contracts'
        run: |
          vendor/bin/pint --test app/Domain/Observables/PhaseProfile.php app/Services/Observables/PhaseProfile*.php app/Services/LedgerService.php app/Services/ContributionDispatcher.php app/Console/Commands/InspectPhaseProfile.php database/migrations/*phase_profile* tests/Unit/PhaseProfileComparisonTest.php tests/Feature/PhaseProfileTest.php
          git diff --check origin/main...HEAD
