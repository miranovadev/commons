name: Phase Profile database isolation check
on:
  push:
    branches: [validation/phase-profile-stage2]
permissions:
  contents: read
jobs:
  fresh_database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -q -d testing -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_DATABASE: testing
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a180ea32311575850f6435b97af8aa526aa9d376
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, pdo_sqlite, curl, intl
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - name: Isolate each existing journey without changing its actions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/Fixtures/HorizonCycleFixture.php')
          s = p.read_text()
          s = s.replace('trait HorizonCycleFixture\n{', '''trait HorizonCycleFixture
          {
              protected function setUp(): void
              {
                  \\Illuminate\\Foundation\\Testing\\RefreshDatabaseState::$migrated = false;
                  parent::setUp();
              }
          ''')
          p.write_text(s)
          PY
      - run: php artisan test --filter='FreshBootstrapTest|HorizonProofCycleTest|OperationalClosurePathTest' --log-junit=test-results/isolation.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolation
          path: test-results/
