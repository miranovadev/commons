name: Initial schema verification

on:
  push:
    branches:
      - refactor/initial-schema
    paths:
      - database/migrations/2026_02_04_085426_create_initial_tables.php
      - .github/workflows/initial-schema-verification.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out schema branch
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Verify fresh migration and rollback
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force

      - name: Run tests
        run: composer test

      - name: Remove disposable verification workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/initial-schema-verification.yml
          git commit -m "Remove schema verification workflow"
          git push
