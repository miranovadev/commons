name: Export PostgreSQL dump reader
on:
  push:
    branches: [nova/postgres-dump-reader]
permissions:
  contents: write
jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package pg_restore with runtime libraries
        run: |
          docker pull postgres:18
          docker run --rm --entrypoint bash postgres:18 -c '
            set -e
            binary=/usr/lib/postgresql/18/bin/pg_restore
            mkdir -p /tmp/bundle/bin /tmp/bundle/lib
            cp "$binary" /tmp/bundle/bin/pg_restore
            ldd "$binary" | awk '\''/=> \// {print $3} /^\// {print $1}'\'' | while read library; do cp -L "$library" "/tmp/bundle/lib/$(basename "$library")"; done
            tar -C /tmp/bundle -czf - .
          ' > pg-restore-portable.tar.gz
          mkdir -p .diagnostics/pg-restore
          base64 -w 0 pg-restore-portable.tar.gz | split -b 500000 - .diagnostics/pg-restore/part-
      - name: Commit encoded bundle
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .diagnostics/pg-restore
          git commit -m 'Export portable pg_restore bundle'
          git push
