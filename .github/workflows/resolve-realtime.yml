name: Resolve realtime dependencies
on:
  push:
    branches: [codex/reverb-realtime]
    paths: [.github/workflows/resolve-realtime.yml]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: composer update laravel/reverb --with-dependencies --no-install --no-scripts --no-interaction
      - run: npm install --package-lock-only --ignore-scripts
      - name: Export dependency files
        run: |
          python3 - <<'PY'
          import pathlib, base64
          for name in ['composer.json', 'composer.lock', 'package.json', 'package-lock.json']:
              encoded = base64.b64encode(pathlib.Path(name).read_bytes()).decode()
              print('FILE_BEGIN ' + name)
              for i in range(0, len(encoded), 4000):
                  print('FILE_DATA ' + encoded[i:i+4000])
              print('FILE_END')
          PY
